# Local Postgres runs in Docker (docker-compose.yml); the app connects over
# TCP. Defaults match the compose service so a fresh clone needs no env vars;
# every value can be overridden for CI or production.
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "cue") %>
  password: <%= ENV.fetch("DB_PASSWORD", "cue") %>
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: cue_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: cue_test<%= ENV["TEST_ENV_NUMBER"] %>

production:
  primary: &primary_production
    <<: *default
    database: cue_production
    username: cue
    password: <%= ENV["CUE_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: cue_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: cue_production_queue
    migrations_paths: db/queue_migrate
