# Pre-commit runs a fast subset on staged files only (~seconds). CI is the
# wall; hooks are the courtesy (foundation plan_4).
pre-commit:
  parallel: true
  jobs:
    - name: rubocop
      glob: '*.rb'
      run: bundle exec rubocop --force-exclusion --no-color {staged_files}

    - name: eslint
      glob: '*.{ts,tsx}'
      run: pnpm exec eslint --no-warn-ignored {staged_files}

    - name: prettier
      glob: '*.{ts,tsx,css,json,yml,yaml,md}'
      # --no-error-on-unmatched-pattern: a commit of only
      # prettier-ignored files (e.g. plans/) is not a formatting failure
      run: pnpm exec prettier --check --ignore-unknown --no-error-on-unmatched-pattern {staged_files}
