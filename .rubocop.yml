# Omakase Ruby styling for Rails, plus spec linting and house cops.
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rspec
  - rubocop-factory_bot
  - rubocop-capybara

require:
  - ./lib/rubocop/cop/cue/system_spec_viewport_matrix

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'db/*schema.rb'
    - 'node_modules/**/*'
    - 'vendor/**/*'
    - 'tmp/**/*'

# Mobile-first enforcement (foundation plan_3): system flows run at both
# viewports. Exceptions require an inline disable with a justification.
Cue/SystemSpecViewportMatrix:
  Include:
    - 'spec/system/**/*_spec.rb'

# Integration-style specs (request/system) assert one behavior through
# several observable effects; a hard 1-expectation rule would just breed
# copy-pasted setup. Keep the cops on with honest ceilings.
RSpec/MultipleExpectations:
  Max: 8

RSpec/ExampleLength:
  Max: 25

# spec/db and spec/design hold schema/design-convention specs — there is
# no class to describe.
RSpec/DescribeClass:
  Exclude:
    - 'spec/db/**/*'
    - 'spec/design/**/*'

# Seat-limit specs must fill a basic-tier org, and basic seats 15 — the
# tier definition, not test extravagance.
FactoryBot/ExcessiveCreateList:
  MaxAmount: 15
