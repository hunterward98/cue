# Local development database. The app runs on the host; only Postgres is
# containerized (foundation plan_2). Postgres 18 gives us native uuidv7().
services:
  db:
    image: postgres:18
    container_name: cue-postgres
    environment:
      POSTGRES_USER: cue
      POSTGRES_PASSWORD: cue
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # Postgres 18 images moved the volume mount up a level; mounting the
      # old /var/lib/postgresql/data path silently loses data on upgrade.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cue']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
