name: Weekly security scan

# CVE discoveries in unchanged code still surface (auth plan_5): the
# same scanners CI runs per-PR, on a schedule, opening an issue on
# failure.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Brakeman
        run: bin/brakeman --no-pager

      - name: bundler-audit
        run: bin/bundler-audit check --update

      - name: pnpm audit (high+)
        run: pnpm audit --audit-level high

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly security scan failed (${new Date().toISOString().slice(0, 10)})`,
              body: `The scheduled security scan failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security'],
            })
